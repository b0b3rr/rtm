<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перетаскивание</title>
  <link rel="stylesheet" href="Zarubin/common.css">
  <link rel="stylesheet" href="drag.css">
</head>
<body>

<div class="topbar">
  <a href="Zarubin/site.html" class="logo">
    <span class="truck">
      <span class="truck-cab"></span>
      <span class="truck-trailer"></span>
      <span class="truck-wheel wheel-1"></span>
      <span class="truck-wheel wheel-2"></span>
      <span class="truck-wheel wheel-3"></span>
    </span>
    <span class="logo-text">Мои работы</span>
  </a>
  <div class="topbar-item">Перетаскивание</div>
</div>

<header class="site-header">
  <nav class="site-nav">
    <a href="Zarubin/site.html">Главная</a>
    <a href="Zarubin/questions.html">Викторина «Ругательства»</a>
    <a href="drag.html">Перетаскивание</a>
    <a href="index.html">Сайт RTM</a>
  </nav>
</header>

<main class="drag-page">

  <div class="box3" id="box3"
     ondragenter="dragEnter(event)"
     ondrop="dragDrop(event)"
     ondragover="dragOver(event)">
  </div>

  <div class="drag-row">

    <div class="box2" id="box2"
         ondragenter="dragEnter(event)"
         ondrop="dragDrop(event)"
         ondragover="dragOver(event)">
    </div>

    <div class="box1" id="box1">
      <div class="box1-top">
        <input type="text" id="wordInput" placeholder="слова - числа - 123">
        <button type="button" id="parseBtn">Разобрать</button>
      </div>
      <p id="errorMsg" class="error-msg"></p>
      <div id="output"></div>
    </div>

  </div>

  <button type="button" id="clearBtn" class="clear-btn">Очистить все</button>

</main>

<footer class="site-footer">
  <p>© Зарубин Ярослав Фиделевич | 5130903/40303</p>
</footer>

<script src="drag.js"></script>
</body>
